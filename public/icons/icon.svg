<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="40%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Subtle Glow Shadow -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#f59e0b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Base with Gold Border -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="6"/>

  <!-- Islamic Geometric Background Motif (Subtle Star Pattern) -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="2" fill="none">
    <circle cx="256" cy="220" r="140"/>
    <circle cx="256" cy="220" r="100"/>
    <polygon points="256,120 286,190 356,190 300,230 320,300 256,260 192,300 212,230 156,190 226,190"/>
    <polygon points="256,140 336,220 256,300 176,220"/>
  </g>

  <!-- Mosque Dome Contour -->
  <path d="M 256 95 C 265 130, 320 165, 320 220 C 320 230, 316 235, 310 238 L 202 238 C 196 235, 192 230, 192 220 C 192 165, 247 130, 256 95 Z" 
        fill="none" stroke="url(#goldGrad)" stroke-width="5" filter="url(#goldGlow)"/>

  <!-- Dome Finial / Crescent Moon and Star -->
  <g transform="translate(256, 82) scale(0.9)">
    <circle cx="0" cy="0" r="10" fill="url(#goldGrad)"/>
    <path d="M -3 -12 A 8 8 0 0 0 5 -4 A 10 10 0 0 1 -3 -12" fill="url(#goldGrad)"/>
    <polygon points="4,-15 6,-11 10,-11 7,-8 8,-4 4,-7 0,-4 1,-8 -2,-11 2,-11" fill="url(#goldGrad)" transform="scale(0.5) translate(4, -18)"/>
  </g>

  <!-- Open Quran / Book Motif -->
  <g filter="url(#goldGlow)">
    <!-- Left Page -->
    <path d="M 256 248 C 220 232, 175 234, 140 248 L 140 310 C 175 296, 220 294, 256 310 Z" 
          fill="#ffffff" fill-opacity="0.95" stroke="url(#goldGrad)" stroke-width="3.5"/>
    <line x1="160" y1="262" x2="238" y2="252" stroke="#064e3b" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="160" y1="276" x2="238" y2="266" stroke="#064e3b" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="160" y1="290" x2="238" y2="280" stroke="#064e3b" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

    <!-- Right Page -->
    <path d="M 256 248 C 292 232, 337 234, 372 248 L 372 310 C 337 296, 292 294, 256 310 Z" 
          fill="#ffffff" fill-opacity="0.95" stroke="url(#goldGrad)" stroke-width="3.5"/>
    <line x1="274" y1="252" x2="352" y2="262" stroke="#064e3b" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="274" y1="266" x2="352" y2="276" stroke="#064e3b" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="274" y1="280" x2="352" y2="290" stroke="#064e3b" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

    <!-- Book Spine Rib Ribbon -->
    <polygon points="256,245 253,322 256,328 259,322" fill="url(#goldGrad)"/>
  </g>

  <!-- Typography: SDI & SMART SCHOOL -->
  <text x="256" y="382" 
        text-anchor="middle" 
        font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" 
        font-size="44" 
        font-weight="900" 
        letter-spacing="4" 
        fill="url(#goldGrad)" 
        filter="url(#goldGlow)">
    SDI SMART
  </text>
  
  <text x="256" y="420" 
        text-anchor="middle" 
        font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" 
        font-size="19" 
        font-weight="700" 
        letter-spacing="6" 
        fill="#ffffff" 
        opacity="0.9">
    MADRASAH DIGITAL
  </text>

  <!-- Small Elegant Islamic Star at Bottom -->
  <g transform="translate(256, 444) scale(0.6)">
    <polygon points="0,-12 3,-3 12,-3 5,2 8,11 0,6 -8,11 -5,2 -12,-3 -3,-3" fill="url(#goldGrad)"/>
  </g>
</svg>
